name: emscripten-builder
on:
  workflow_dispatch:
    branches: [ master, stable* ]
  pull_request:
    branches: [ master, stable* ]
  schedule:
    - cron: '30 5 * * SUN'

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Run emscripten build and unit tests on ubuntu-latest"
    container: emscripten/emsdk:6.0.12
    steps:
      - name: "Check out source"
        uses: actions/checkout@v7

      - name: "Prepare environment"
        run: |
          apt-get update -q -y
          apt-get install -q -y ninja-build

      - name: Restore Dependencies
        id: restore-dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            !build-emscripten/**/freerdp
            build-emscripten/**
          key: ${{ runner.os }}-emscripten-${{ hashFiles('scripts/emscripten.sh') }}

      - name: Build Dependencies
        if: steps.restore-dependencies.outputs.cache-hit != 'true'
        run: |
          ./scripts/emscripten.sh --build-deps-only

      - name: Save Dependencies
        id: save-dependencies
        if: steps.restore-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            !build-emscripten/**/freerdp
            build-emscripten/**
          key: ${{ runner.os }}-emscripten-${{ hashFiles('scripts/emscripten.sh') }}

      - name: "Run emscripten build and unit tests..."
        run: |
          ./scripts/emscripten.sh -c -d --with-tests
