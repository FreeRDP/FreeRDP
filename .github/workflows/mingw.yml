name: mingw-builder
on:
  workflow_dispatch:
    branches: [ master, stable* ]
  schedule:
    - cron: '30 5 * * SUN'

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Run mingw build on ubuntu-latest"
    steps:
      - name: "Check out source"
        uses: actions/checkout@v7

      - name: "Prepare environment"
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y \
            git \
            nasm \
            meson \
            cmake \
            ninja-build \
            mingw-w64 \
            mingw-w64-tools \
            binutils-mingw-w64

      - name: Cache Dependencies
        id: cache-dependencies
        uses: actions/cache@v6
        with:
          path: |
            !build-mingw/**/freerdp
            build-mingw/**
          key: ${{ runner.os }}-mingw-${{ hashFiles('scripts/mingw.sh') }}

      - name: Build Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          ./scripts/mingw.sh --build-deps-only
          ./scripts/mingw.sh -c -s --build-deps-only

      - name: "Run mingw [shared] build..."
        run: |
          ./scripts/mingw.sh -c -d

      - name: "Run mingw [static] build..."
        run: |
          ./scripts/mingw.sh -c -d -s
